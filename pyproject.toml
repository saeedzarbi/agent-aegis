[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-aegis"
version = "0.1.0"
description = "Policy guardrails and tamper-evident audit for tool-calling AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Saeed Zarbi", email = "saeedzarbi95@gmail.com" }]
keywords = ["ai-agents", "llm-security", "mcp", "prompt-injection", "guardrails"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "typer>=0.15",
  "rich>=13.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx>=0.28"]

[project.scripts]
aegis = "aegis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
